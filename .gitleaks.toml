# Secret scan (SPEC 16.7 item 12): gitleaks' default rules, plus an allowlist of throwaway values that tests use on purpose.
# Only exact test strings are allowed here; never add a real key, and never allowlist a whole file.
[extend]
useDefault = true

[allowlist]
description = "Fixed test-only values (integration test job secret, logging redaction test password, three made-up hex values in commit 22c390b's site-url unit test, since replaced by random ones)"
regexes = ['''integration-tests-tick-secret-0123456789''', '''pw-123456789''', '''9f8e7d6c5b4a39281706f5e4d3c2b1a09f8e7d6c5b4a3928''', '''0a1b2c3d4e5f60718293a4b5c6d7e8f9''', '''f1e2d3c4b5a69788796a5b4c3d2e1f00f1e2d3c4''']
