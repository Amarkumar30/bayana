# Render Blueprint for the Bayana API (SPEC 16.5). Values never live here: every variable marked `sync: false`
# is entered once in the Render dashboard when the Blueprint is applied. Steps and the per-environment matrix: docs/DEPLOY.md.
# Migrations are NOT run by Render (the free plan has no pre-deploy step); run them from your laptop with DATABASE_URL_DIRECT.
services:
  - type: web
    name: bayana-api-staging
    runtime: docker
    plan: free
    region: singapore
    # Staging deploys from hosting-ready until that branch is merged; then change this to main.
    branch: hosting-ready
    autoDeploy: true
    # The image is built from the repository root so the pnpm workspace and @bayana/shared are available.
    dockerContext: .
    dockerfilePath: ./apps/api/Dockerfile
    healthCheckPath: /health
    # Only these paths trigger a rebuild; web-only changes do not redeploy the API.
    buildFilter:
      paths:
        - apps/api/**
        - packages/shared/**
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
    envVars:
      # Fixed, non-secret values. Render injects PORT itself; the API reads it.
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      # Entered in the dashboard (names only here).
      - key: APP_ENV
        sync: false
      # WEB_ORIGINS: the site origin first (emailed links and the Google sign-in return use it), e.g. https://bayana.in.
      # SESSION_COOKIE_DOMAIN: covers both the web and API hosts, e.g. .bayana.in. Before/after values: docs/DOMAIN_SWITCH.md.
      - key: WEB_ORIGINS
        sync: false
      - key: SESSION_COOKIE_DOMAIN
        sync: false
      # Empty means bayana_session (the Google state cookie is then bayana_google). Same value in Vercel. Set in the dashboard,
      # never pinned here, so no deployment name is baked into the repository.
      - key: SESSION_COOKIE_NAME
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_DIRECT
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: OTP_PEPPER
        sync: false
      - key: TICK_SECRET
        sync: false
      - key: OPS_EMAIL
        sync: false
      - key: EMAIL_TRANSPORT
        sync: false
      - key: SMTP_URL
        sync: false
      # With EMAIL_TRANSPORT=brevo_api (HTTPS, recommended here) set BREVO_API_KEY and leave SMTP_URL empty.
      - key: BREVO_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: PAYMENT_MODE
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: HOLD_MINUTES
        sync: false
      - key: REQUEST_HOLD_HOURS
        sync: false
      - key: MIN_ADVANCE_PAISE
        sync: false
      # Google sign-in (docs/DEPLOY.md section 7). Leave all three empty to keep Google off; set all three to turn it on.
      # Redirect URI: <API origin>/v1/auth/google/callback, e.g. https://api.bayana.in/v1/auth/google/callback
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      # Deliberately absent: LIVE_PAYMENTS_ACK (live payments stay off until every SPEC 16.8 gate is done) and
      # PAYMENT_PROVIDER (defaults to razorpay; "fake" is refused outside tests).
