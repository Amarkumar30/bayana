name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bayana
          POSTGRES_PASSWORD: bayana
          POSTGRES_DB: bayana_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bayana -d bayana_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      # Throwaway CI-only values; no real secrets are needed to verify the build.
      APP_ENV: local
      WEB_ORIGINS: http://ci.invalid
      DATABASE_URL: postgres://bayana:bayana@127.0.0.1:5432/bayana_ci
      DATABASE_URL_TEST: postgres://bayana:bayana@127.0.0.1:5432/bayana_test
      SESSION_SECRET: ci-only-session-secret-not-used-anywhere-else
      OTP_PEPPER: ci-only-otp-pepper-value
      EMAIL_TRANSPORT: smtp
      SMTP_URL: smtp://127.0.0.1:1025
      EMAIL_FROM: ci@example.test
      PAYMENT_MODE: disabled
      NEXT_PUBLIC_API_URL: http://api.ci.invalid
      NEXT_PUBLIC_SITE_URL: http://ci.invalid
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm db:migrate:test
      - run: pnpm test
      - run: pnpm build
