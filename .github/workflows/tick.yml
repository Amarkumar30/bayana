name: Jobs tick
# Every 3 hours: wakes the API, then calls POST /internal/jobs/tick: expire holds, retry webhooks, queue reminders, send the email outbox (SPEC 15.3).
# The backstop for when nobody uses the app. Render's free hours for this schedule: docs/DEPLOY.md, "Scheduled jobs and Render hours".
# OFF until you set the repository variable JOBS_ENABLED=true (Settings > Secrets and variables > Actions > Variables)
# and add the secrets API_URL (for example https://api.bayana.in, no trailing slash) and TICK_SECRET (same value as the API's).
# GitHub's scheduler is best-effort and may run late or skip; every job is safe to run late or twice.
on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:
permissions: {}
concurrency:
  group: jobs-tick
  cancel-in-progress: false
jobs:
  tick:
    if: ${{ vars.JOBS_ENABLED == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Wake the API, then call the tick endpoint
        env:
          API_URL: ${{ secrets.API_URL }}
          TICK_SECRET: ${{ secrets.TICK_SECRET }}
        run: |
          if [ -z "$API_URL" ] || [ -z "$TICK_SECRET" ]; then echo "Set the API_URL and TICK_SECRET repository secrets first."; exit 1; fi
          # A sleeping free instance takes about a minute to wake: try /health for up to 2 minutes before the tick.
          until curl --silent --fail --output /dev/null --max-time 20 "$API_URL/health"; do
            if [ "$SECONDS" -ge 120 ]; then echo "The API did not answer /health within 2 minutes."; exit 1; fi
            sleep 10
          done
          curl --silent --show-error --fail-with-body --max-time 120 -X POST -H "Authorization: Bearer $TICK_SECRET" "$API_URL/internal/jobs/tick"
